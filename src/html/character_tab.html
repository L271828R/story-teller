<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
{{HLJS_CSS}}
{{HLJS_JS}}
{{MERMAID_JS}}
<style>
:root {
  --bg:#f5f5f5; --surface:#fff; --border:#ddd;
  --text:#222; --muted:#888; --accent:#0066cc;
  --pill-active:#0066cc; --pill-active-text:#fff;
  --card-bg:#fff; --card-hover:#f0f4ff;
  --card-checked:#e8f0fe; --card-checked-border:#0066cc;
  --danger:#cc0000; --btn-bg:#fff;
  --chat-user-bg:#e8f0fe; --chat-user-border:#0066cc;
  --chat-persona-bg:#fff; --chat-persona-border:#ddd;
  --chat-msg-size: 12px;
}
.dark {
  --bg:#1e1e1e; --surface:#2a2a2a; --border:#444;
  --text:#e0e0e0; --muted:#999; --accent:#4d9fff;
  --pill-active:#4d9fff; --pill-active-text:#111;
  --card-bg:#2a2a2a; --card-hover:#2a2a3a;
  --card-checked:#1a2a3a; --card-checked-border:#4d9fff;
  --danger:#ff5555; --btn-bg:#2a2a2a;
  --chat-user-bg:#1a2a3a; --chat-user-border:#4d9fff;
  --chat-persona-bg:#2a2a2a; --chat-persona-border:#444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px; background: var(--bg); color: var(--text);
}

/* ── Shell: two-column flex ─────────────────────────── */
#shell { display: flex; height: 100%; overflow: hidden; }

/* ── Left: persona grid ─────────────────────────────── */
#left { flex: 1; overflow-y: auto; padding: 16px; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

.top-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.search {
  flex: 1; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 13px; outline: none;
}
.search:focus { border-color: var(--accent); }

.filter-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; align-items: center;
}
.pill {
  padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  cursor: pointer; font-size: 12px; user-select: none;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background .15s, border-color .15s;
}
.pill:hover { background: var(--card-hover); }
.pill.active { background: var(--pill-active); color: var(--pill-active-text); border-color: var(--pill-active); font-weight: 600; }
.pill .pdel { font-size: 10px; opacity: .6; line-height: 1; cursor: pointer; }
.pill .pdel:hover { opacity: 1; color: var(--danger); }
.btn-add-cat {
  padding: 4px 10px; border-radius: 20px; border: 1px dashed var(--border);
  background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
}
.btn-add-cat:hover { border-color: var(--accent); color: var(--accent); }
.cat-form { display: inline-flex; gap: 4px; align-items: center; }
.cat-inp {
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--accent);
  background: var(--surface); color: var(--text); font-size: 12px; width: 130px; outline: none;
}
.btn-xs {
  padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: none;
}
.btn-ok  { background: var(--accent); color: #fff; }
.btn-ok:hover { filter: brightness(1.1); }
.btn-no  { background: var(--border); color: var(--text); }
.btn-no:hover { filter: brightness(.9); }

.grid { display: flex; flex-wrap: wrap; gap: 14px; }
.card {
  width: 148px; background: var(--card-bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative; transition: background .15s, border-color .15s;
}
.card:hover { background: var(--card-hover); }
.card.checked { background: var(--card-checked); border-color: var(--card-checked-border); }

.card-check {
  position: absolute; top: 8px; right: 8px;
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);
}
.card-del {
  position: absolute; top: 6px; left: 8px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; line-height: 1; padding: 0;
  opacity: .35;
}
.card-del:hover { color: var(--danger); opacity: 1; }
.card-ren {
  position: absolute; top: 6px; left: 26px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; line-height: 1; padding: 0;
  opacity: .35;
}
.card-ren:hover { color: var(--accent); opacity: 1; }
.rename-active { border-color: var(--accent); }
.rename-inp {
  width: 100%; border: 1px solid var(--accent); border-radius: 5px;
  background: var(--surface); color: var(--text); font-size: 12px;
  padding: 4px 6px; outline: none; font-family: inherit;
}

.avatar {
  width: 72px; height: 72px; border-radius: 50%;
  overflow: hidden; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 24px; font-weight: 700; color: #fff;
  cursor: pointer; transition: border-color .15s;
}
.card.checked .avatar { border-color: var(--card-checked-border); }
.avatar:hover { border-color: var(--accent); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pname {
  font-size: 11px; font-weight: 500; text-align: center;
  color: var(--text); line-height: 1.3; word-break: break-word;
}
.cat-badge { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.desc-ta {
  width: 100%; border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--text); font-size: 11px;
  font-family: inherit; padding: 3px 6px; resize: none; outline: none; line-height: 1.4;
}
.desc-ta:focus { border-color: var(--accent); }

.btn-chat {
  width: 100%; padding: 4px 0; border-radius: 5px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--accent); cursor: pointer; font-size: 11px;
  transition: background .15s, border-color .15s;
}
.btn-chat:hover { background: var(--card-hover); border-color: var(--accent); }
.btn-chat.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.add-card {
  width: 148px; border: 2px dashed var(--border); border-radius: 10px;
  padding: 12px 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; transition: border-color .15s; min-height: 140px;
  background: transparent;
}
.add-card:hover { border-color: var(--accent); }
.add-card .plus { font-size: 26px; color: var(--muted); }
.add-card .add-lbl { font-size: 11px; color: var(--muted); }

.add-form-card {
  width: 148px; border: 2px solid var(--accent); border-radius: 10px;
  padding: 12px 10px; display: flex; flex-direction: column; gap: 6px;
  background: var(--card-bg);
}
.add-form-card input, .add-form-card select {
  width: 100%; border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--text); font-size: 12px;
  padding: 4px 6px; outline: none; font-family: inherit;
}
.add-form-card input:focus { border-color: var(--accent); }
.add-form-btns { display: flex; gap: 4px; }
.add-form-btns .btn-xs { flex: 1; padding: 4px 0; font-size: 11px; }

.empty { color: var(--muted); padding: 32px; text-align: center; width: 100%; }

/* ── Groups section ─────────────────────────────────── */
.groups-h2 {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); margin: 20px 0 10px;
}
.group-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface);
  margin-bottom: 8px; transition: background .15s, border-color .15s;
}
.group-card:hover { background: var(--card-hover); }
.group-card.active-group {
  background: var(--card-checked); border-color: var(--card-checked-border);
}
.gavatar-stack { position: relative; height: 36px; width: 48px; flex-shrink: 0; }
.gavatar {
  position: absolute; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff; overflow: hidden;
}
.gavatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.group-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }

/* ── Mermaid right-click context menu ───────────────── */
.ctx-menu {
  position: fixed; z-index: 9999; background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 4px 0; min-width: 150px;
  display: none;
}
.ctx-menu.open { display: block; }
.ctx-item {
  padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text);
  white-space: nowrap;
}
.ctx-item:hover { background: var(--card-hover); }

/* ── Resizer handle ─────────────────────────────────── */
#resizer {
  width: 5px; flex-shrink: 0; cursor: col-resize;
  background: var(--border);
  display: none; align-items: stretch;
  transition: background .15s;
}
#resizer.visible { display: flex; }
#resizer:hover, #resizer.dragging { background: var(--accent); }

/* ── Right: chat panel ──────────────────────────────── */
#right {
  width: 340px; min-width: 220px;
  border-left: none; position: relative;
  display: none; flex-direction: column; background: var(--surface);
}
#right.open { display: flex; }

/* ── Font size floater ──────────────────────────────── */
.chat-font-floater {
  position: absolute; bottom: 70px; right: 10px; z-index: 5;
  display: flex; align-items: center; gap: 3px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 8px;
  opacity: 0; transition: opacity .2s;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
#right:hover .chat-font-floater { opacity: 1; pointer-events: auto; }
.chat-font-floater button {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 14px; padding: 0 3px; line-height: 1;
  border-radius: 3px;
}
.chat-font-floater button:hover { color: var(--accent); background: var(--card-hover); }
.chat-font-floater .font-label {
  font-size: 10px; color: var(--muted); min-width: 26px; text-align: center;
}

#chat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative;
}
#chat-avatar-sm {
  width: 36px; height: 36px; border-radius: 50%;
  overflow: hidden; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
#chat-avatar-sm img { width: 100%; height: 100%; object-fit: cover; display: block; }
#chat-name-label {
  flex: 1; font-weight: 600; font-size: 13px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-hbtn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 4px;
}
.chat-hbtn:hover { background: var(--card-hover); color: var(--text); }

#article-row {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted); flex-shrink: 0;
  background: var(--bg);
}
#article-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
#article-toggle { accent-color: var(--accent); cursor: pointer; }

#chat-history {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.chat-turn { display: flex; flex-direction: column; gap: 6px; }
.chat-q {
  align-self: flex-end; max-width: 85%;
  background: var(--chat-user-bg); border: 1px solid var(--chat-user-border);
  border-radius: 12px 12px 2px 12px;
  padding: 7px 10px; font-size: var(--chat-msg-size); line-height: 1.5;
}
.chat-a {
  align-self: flex-start; max-width: 90%;
  background: var(--chat-persona-bg); border: 1px solid var(--chat-persona-border);
  border-radius: 12px 12px 12px 2px;
  padding: 7px 10px; font-size: var(--chat-msg-size); line-height: 1.5;
}
.chat-q p, .chat-a p { margin: 0 0 4px; }
.chat-q p:last-child, .chat-a p:last-child { margin-bottom: 0; }
.chat-q ul, .chat-a ul, .chat-q ol, .chat-a ol { margin: 4px 0 4px 16px; }
.chat-waiting { color: var(--muted); font-style: italic; }
pre { margin: 6px 0; border-radius: 6px; overflow-x: auto; }
pre code.hljs { border-radius: 6px; font-size: 11px; }
.mermaid-wrapper { border-radius: 6px; overflow: hidden; margin: 6px 0; }
.chat-speaker {
  display: block; font-size: 10px; font-weight: 600;
  color: var(--accent); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .04em;
}

/* ── CJK font size boost ────────────────────────────── */
#chat-history.lang-cjk .chat-q,
#chat-history.lang-cjk .chat-a { font-size: 15px; line-height: 1.7; }

/* ── Invite picker ──────────────────────────────────── */
#invite-picker {
  position: absolute; top: 100%; right: 0; z-index: 10;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  min-width: 180px; overflow: hidden;
  display: none; flex-direction: column;
}
#invite-picker.open { display: flex; }
.invite-search-inp {
  display: block; width: 100%; padding: 7px 12px;
  border: none; border-bottom: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 12px; font-family: inherit; outline: none;
  border-radius: 8px 8px 0 0;
}
.invite-search-inp:focus { border-bottom-color: var(--accent); }
#invite-list { max-height: 200px; overflow-y: auto; }
.invite-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; cursor: pointer; font-size: 12px;
}
.invite-item:hover { background: var(--card-hover); }
.invite-item.active-persona { color: var(--muted); cursor: default; }
.invite-item .inv-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}

/* ── @ mention popup ────────────────────────────────── */
#mention-pop {
  position: absolute; bottom: 100%; left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px 8px 0 0; box-shadow: 0 -4px 12px rgba(0,0,0,.15);
  max-height: 160px; overflow-y: auto;
  display: none;
}
#mention-pop.open { display: block; }
.mention-item {
  padding: 7px 12px; cursor: pointer; font-size: 12px;
}
.mention-item:hover, .mention-item.focused { background: var(--card-hover); }

#chat-input-area {
  display: flex; gap: 6px; padding: 10px 12px;
  border-top: 1px solid var(--border);
  align-items: flex-end;
}
#chat-ta {
  flex: 1; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 12px; font-family: inherit;
  resize: none; outline: none; line-height: 1.4; max-height: 100px;
}
#chat-ta:focus { border-color: var(--accent); }
#send-btn {
  padding: 7px 14px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 12px; font-weight: 600; white-space: nowrap; align-self: flex-end;
}
#send-btn:hover { filter: brightness(1.1); }
#send-btn:disabled, #chat-ta:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body class="{{BODY_CLASS}}">
<div id="shell">

<!-- ── Left column: persona grid ─────────────────────── -->
<div id="left">
<h2>Characters &amp; Personas</h2>
<div class="top-bar">
  <input class="search" id="search" type="text" placeholder="Search…" oninput="setSearch(this.value)">
</div>
<div class="filter-bar" id="filters"></div>
<div class="grid" id="grid"></div>
<div id="groups-section"></div>
</div>

<div id="resizer"></div>

<!-- ── Right column: chat panel ──────────────────────── -->
<div id="right">
  <div id="chat-header">
    <div id="chat-avatar-sm"></div>
    <div id="chat-name-label"></div>
    <button class="chat-hbtn" id="invite-btn" onclick="toggleInvitePicker(event)" title="Invite a persona">+ Invite</button>
    <button class="chat-hbtn" onclick="clearChat()" title="Clear conversation">Clear</button>
    <button class="chat-hbtn" onclick="closeChat()" title="Close chat">&times;</button>
    <div id="invite-picker"></div>
  </div>
  <div id="article-row">
    <label>
      <input type="checkbox" id="article-toggle">
      Use article as context
    </label>
  </div>
  <div id="chat-history"></div>
  <div class="chat-font-floater" id="chat-font-floater">
    <button onclick="setChatFontSize(_chatFontSize - 1)" title="Smaller">A−</button>
    <span class="font-label" id="font-size-label">12px</span>
    <button onclick="setChatFontSize(_chatFontSize + 1)" title="Larger">A+</button>
  </div>
  <div style="position:relative; flex-shrink:0;">
    <div id="mention-pop"></div>
    <div id="chat-input-area">
      <textarea id="chat-ta" rows="2" placeholder="Message… (Cmd+Enter to send)"
                onkeydown="chatKey(event)" oninput="chatInput(this)"></textarea>
      <button id="send-btn" onclick="doSend()">Send</button>
    </div>
  </div>
</div>

</div><!-- #shell -->

<div id="ctx-menu" class="ctx-menu"></div>

<script>
var _cats    = {};
var _imgs    = {};
var _checked = {};
var _descs   = {};
var _cur      = '__all__';
var _search   = '';
var _addCat   = false;
var _addChar  = false;
var _renaming = null;
var _chatPersona   = null;
var _activePersonas = [];

function send(obj) {
  window.webkit.messageHandlers.characters.postMessage(JSON.stringify(obj));
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function eattr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function ej(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
}
function norm(s) {
  return s.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_-￿]/g,'').replace(/_+/g,'_').replace(/^_|_$/g,'');
}
function nameColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++)
    h = (h * 31 + name.charCodeAt(i)) & 0xfffffff;
  return 'hsl(' + (h % 360) + ',52%,42%)';
}
function fuzzy(name, q) {
  if (!q) return true;
  var n = name.toLowerCase(), qi = 0;
  for (var i = 0; i < n.length && qi < q.length; i++)
    if (n[i] === q[qi]) qi++;
  return qi === q.length;
}

function allNames() {
  var seen = {}, out = [];
  Object.keys(_cats).sort().forEach(function(c) {
    _cats[c].forEach(function(n) { if (!seen[n]) { seen[n] = 1; out.push(n); } });
  });
  return out.sort();
}
function getNames() {
  var names = _cur === '__all__' ? allNames() : (_cats[_cur] || []).slice().sort();
  if (_search) {
    var q = _search.toLowerCase();
    names = names.filter(function(n) { return fuzzy(n, q); });
  }
  return names;
}
function getCat(name) {
  var found = [];
  Object.keys(_cats).forEach(function(c) {
    if (_cats[c].indexOf(name) !== -1) found.push(c);
  });
  return found[0] || '';
}

function renderFilters() {
  var cats = Object.keys(_cats).sort();
  var h = '<div class="pill' + (_cur === '__all__' ? ' active' : '') +
          '" onclick="setFilter(\'__all__\')">All</div>';
  cats.forEach(function(c) {
    h += '<div class="pill' + (_cur === c ? ' active' : '') +
         '" onclick="setFilter(\'' + ej(c) + '\')">' + esc(c) +
         '<span class="pdel" onclick="event.stopPropagation();delCat(\'' + ej(c) + '\')">✕</span>' +
         '</div>';
  });
  if (_addCat) {
    h += '<div class="cat-form">' +
         '<input class="cat-inp" id="catInp" placeholder="Category…" ' +
         'onkeydown="catKey(event)">' +
         '<button class="btn-xs btn-ok" onclick="okCat()">✓</button>' +
         '<button class="btn-xs btn-no" onclick="cancelCat()">✕</button>' +
         '</div>';
  } else {
    h += '<button class="btn-add-cat" onclick="startCat()">+ Category</button>';
  }
  document.getElementById('filters').innerHTML = h;
  if (_addCat) { var el = document.getElementById('catInp'); if (el) el.focus(); }
}

function renderGrid() {
  var names = getNames();
  var h = names.map(function(name) {
    var key = norm(name);
    var url = _imgs[key];
    var chk = !!_checked[name];
    var isChatting = _chatPersona === name;
    var catLabel = (_cur === '__all__' && !_search)
      ? '<div class="cat-badge">' + esc(getCat(name)) + '</div>' : '';
    var avatar = url
      ? '<img src="' + esc(url) + '" alt="' + eattr(name) + '">'
      : '<span style="background:' + nameColor(name) + '">' +
        esc(name.trim().charAt(0).toUpperCase()) + '</span>';
    var desc = esc(_descs[name] || '');
    if (_renaming === name) {
      return '<div class="card rename-active">' +
        '<div class="pname" style="margin-top:8px">' + esc(name) + '</div>' +
        '<input class="rename-inp" id="renameInp" value="' + eattr(name) + '" placeholder="New name…"' +
          ' onkeydown="renameKey(event,\'' + ej(name) + '\')">' +
        '<div class="add-form-btns">' +
          '<button class="btn-xs btn-ok" onclick="confirmRename(\'' + ej(name) + '\')">Rename</button>' +
          '<button class="btn-xs btn-no" onclick="cancelRename()">Cancel</button>' +
        '</div></div>';
    }
    return '<div class="card' + (chk ? ' checked' : '') + '">' +
      '<button class="card-del" onclick="delChar(\'' + ej(name) + '\')" title="Remove">✕</button>' +
      '<button class="card-ren" onclick="startRename(\'' + ej(name) + '\')" title="Rename">✎</button>' +
      '<input type="checkbox" class="card-check"' + (chk ? ' checked' : '') +
        ' onchange="toggleChar(\'' + ej(name) + '\',this.checked)">' +
      '<div class="avatar" onclick="uploadImg(\'' + ej(name) + '\')" title="Upload image">' +
        avatar + '</div>' +
      '<div class="pname">' + esc(name) + '</div>' +
      catLabel +
      '<textarea class="desc-ta" rows="2" placeholder="Notes…" data-name="' + eattr(name) + '"' +
        ' oninput="scheduleDesc(\'' + ej(name) + '\',this.value)"' +
        ' onblur="saveDesc(\'' + ej(name) + '\',this.value)">' + desc + '</textarea>' +
      '<button class="btn-chat' + (isChatting ? ' active' : '') + '"' +
        ' onclick="openPersonaChat(\'' + ej(name) + '\')" title="Chat with this persona">' +
        (isChatting ? '&#x1f4ac; Chatting' : '&#x1f4ac; Chat') +
        '</button>' +
      '</div>';
  }).join('');

  if (_addChar) {
    var opts = Object.keys(_cats).sort().map(function(c) {
      return '<option value="' + eattr(c) + '"' +
             (c === _cur && _cur !== '__all__' ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
    h += '<div class="add-form-card">' +
         '<input id="charInp" placeholder="Name…" onkeydown="charKey(event)">' +
         (opts ? '<select id="charCat">' + opts + '</select>' : '') +
         '<div class="add-form-btns">' +
         '<button class="btn-xs btn-ok" onclick="okChar()">Add</button>' +
         '<button class="btn-xs btn-no" onclick="cancelChar()">Cancel</button>' +
         '</div></div>';
  } else {
    h += '<div class="add-card" onclick="startChar()">' +
         '<span class="plus">+</span>' +
         '<span class="add-lbl">Add character</span></div>';
  }

  var el = document.getElementById('grid');
  el.innerHTML = h || '<div class="empty">No characters found.</div>';
  if (_addChar) { var ci = document.getElementById('charInp'); if (ci) ci.focus(); }
}

function render() { renderFilters(); renderGrid(); renderGroups(); }

function setFilter(cat) { _cur = cat; render(); }
function setSearch(val) { _search = val.trim(); renderGrid(); }

function startCat() { _addCat = true; renderFilters(); }
function cancelCat() { _addCat = false; renderFilters(); }
function okCat() {
  var el = document.getElementById('catInp');
  var name = el ? el.value.trim() : '';
  _addCat = false;
  if (name) send({action:'addCategory', name:name});
  else renderFilters();
}
function catKey(e) { if (e.key==='Enter') okCat(); else if (e.key==='Escape') cancelCat(); }
function delCat(name) {
  if (!confirm('Delete category "' + name + '" and all its characters?')) return;
  send({action:'deleteCategory', name:name});
}

function startChar() { _addChar = true; renderGrid(); }
function cancelChar() { _addChar = false; renderGrid(); }
function okChar() {
  var ni = document.getElementById('charInp');
  var cs = document.getElementById('charCat');
  var name = ni ? ni.value.trim() : '';
  var cat  = cs ? cs.value : (Object.keys(_cats).sort()[0] || '');
  _addChar = false;
  if (name && cat) send({action:'addCharacter', category:cat, name:name});
  else renderGrid();
}
function charKey(e) { if (e.key==='Enter') okChar(); else if (e.key==='Escape') cancelChar(); }
function delChar(name) {
  send({action:'deleteCharacter', category:getCat(name), name:name});
}

function toggleChar(name, checked) {
  _checked[name] = checked;
  renderGrid();
  send({action:'toggle', name:name, checked:checked});
}
var _descTimers = {};
function scheduleDesc(name, desc) {
  _descs[name] = desc;
  clearTimeout(_descTimers[name]);
  _descTimers[name] = setTimeout(function() { saveDesc(name, desc); }, 600);
}
function saveDesc(name, desc) {
  _descs[name] = desc;
  send({action:'setDesc', name:name, description:desc});
}
function uploadImg(name) {
  send({action:'uploadImage', name:name});
}

function startRename(name) {
  _renaming = name;
  renderGrid();
  setTimeout(function() {
    var el = document.getElementById('renameInp');
    if (el) { el.focus(); el.select(); }
  }, 0);
}
function cancelRename() { _renaming = null; renderGrid(); }
function confirmRename(oldName) {
  var el = document.getElementById('renameInp');
  var newName = el ? el.value.trim() : '';
  if (!newName || newName === oldName) { cancelRename(); return; }
  _renaming = null;
  send({action:'renameCharacter', oldName:oldName, newName:newName});
}
function renameKey(e, oldName) {
  if (e.key === 'Enter') confirmRename(oldName);
  else if (e.key === 'Escape') cancelRename();
}

function setCharacters(data) {
  _cats    = data.cats    || {};
  _imgs    = data.imgs    || {};
  _descs   = data.descs   || {};
  _checked = {};
  (data.checked || []).forEach(function(n) { _checked[n] = true; });
  if (_cur !== '__all__' && !_cats[_cur]) _cur = '__all__';
  render();
}

function setDarkMode(dark) {
  document.body.classList.toggle('dark', dark);
}

// ── Group chats ──────────────────────────────────────────────────────────────

var _groups = []; // [{key, participants:[]}]

function groupKey(participants) {
  var normed = participants.map(function(n) { return norm(n); }).sort();
  return normed.join('+');
}

function renderGroups() {
  var sec = document.getElementById('groups-section');
  if (!sec) return;
  if (!_groups.length) { sec.innerHTML = ''; return; }

  var activeKey = _activePersonas.length > 1 ? groupKey(_activePersonas) : null;

  var h = '<div class="groups-h2">Group Chats</div>';
  _groups.forEach(function(g) {
    var isActive = activeKey && g.key === activeKey;
    // Stacked avatar bubbles (up to 4)
    var avatarPositions = ['top:0;left:0','bottom:0;right:0','top:0;right:0','bottom:0;left:0'];
    var avatars = g.participants.slice(0, 4).map(function(pname, i) {
      var k   = norm(pname);
      var url = _imgs[k];
      var bg  = 'background:' + nameColor(pname) + ';';
      var pos = avatarPositions[i] + ';';
      var inner = url
        ? '<img src="' + eattr(url) + '" alt="">'
        : esc(pname.trim().charAt(0).toUpperCase());
      return '<div class="gavatar" style="' + bg + pos + '">' + inner + '</div>';
    }).join('');

    h += '<div class="group-card' + (isActive ? ' active-group' : '') +
      '" onclick="openGroupChat(\'' + ej(g.key) + '\')">' +
      '<div class="gavatar-stack">' + avatars + '</div>' +
      '<div class="group-label">' + esc(g.participants.join(' + ')) + '</div>' +
      '</div>';
  });
  sec.innerHTML = h;
}

function setGroups(groups) {
  _groups = groups || [];
  renderGroups();
}

function openGroupChat(key) {
  send({action:'openGroupChat', key:key});
}

window.updatePersonaImage = function(key, url) {
  _imgs[key] = url;
  renderGrid();
};

// ── Invite picker ────────────────────────────────────────────────────────────

var _inviteSearch = '';

function renderInvitePicker() {
  var picker = document.getElementById('invite-picker');
  _inviteSearch = '';
  picker.innerHTML =
    '<input id="invite-search" class="invite-search-inp" placeholder="Search…"' +
    ' oninput="renderInviteList(this.value)"' +
    ' onkeydown="inviteSearchKey(event)">' +
    '<div id="invite-list"></div>';
  renderInviteList('');
}

function renderInviteList(q) {
  _inviteSearch = (q || '').toLowerCase();
  var names = allNames().filter(function(n) { return fuzzy(n, _inviteSearch); });
  var h = names.map(function(name) {
    var isActive = _activePersonas.indexOf(name) !== -1;
    return '<div class="invite-item' + (isActive ? ' active-persona' : '') + '"' +
      (isActive ? '' : ' onclick="invitePersona(\'' + ej(name) + '\')"') + '>' +
      (isActive ? '<span class="inv-dot"></span>' : '') +
      esc(name) + '</div>';
  }).join('');
  var list = document.getElementById('invite-list');
  if (list) list.innerHTML = h || '<div class="invite-item" style="color:var(--muted)">No personas</div>';
}

function inviteSearchKey(e) {
  if (e.key === 'Escape') {
    document.getElementById('invite-picker').classList.remove('open');
    _inviteSearch = '';
  }
}

function toggleInvitePicker(e) {
  e.stopPropagation();
  var picker = document.getElementById('invite-picker');
  if (picker.classList.contains('open')) {
    picker.classList.remove('open');
  } else {
    renderInvitePicker();
    picker.classList.add('open');
    setTimeout(function() {
      var inp = document.getElementById('invite-search');
      if (inp) inp.focus();
    }, 0);
  }
}

function invitePersona(name) {
  document.getElementById('invite-picker').classList.remove('open');
  send({action:'invitePersona', name:name});
}

document.addEventListener('click', function(e) {
  var p = document.getElementById('invite-picker');
  if (p && !p.contains(e.target)) p.classList.remove('open');
});

// Called from C++ to update the active-persona chip list in the header.
function setActivePersonas(names) {
  _activePersonas = names;
  _chatPersona    = names.length > 0 ? names[0] : null;
  var label = document.getElementById('chat-name-label');
  if (label) label.textContent = names.join(' + ');
}

// ── @ mention autocomplete ───────────────────────────────────────────────────

var _mentionQ   = null;
var _mentionIdx = -1;

function chatInput(ta) {
  if (_activePersonas.length < 2) { hideMentionPop(); return; }
  var pos    = ta.selectionStart;
  var before = ta.value.substring(0, pos);
  var m      = before.match(/@(\w*)$/);
  if (m) {
    _mentionQ   = m[1].toLowerCase();
    _mentionIdx = -1;
    renderMentionPop();
  } else {
    hideMentionPop();
  }
}

function renderMentionPop() {
  var pop      = document.getElementById('mention-pop');
  var personas = _activePersonas.filter(function(n) { return fuzzy(n, _mentionQ); });
  if (!personas.length) { hideMentionPop(); return; }
  pop.innerHTML = personas.map(function(name, i) {
    return '<div class="mention-item' + (i === _mentionIdx ? ' focused' : '') + '"' +
      ' onclick="selectMention(\'' + ej(name) + '\')">' + esc(name) + '</div>';
  }).join('');
  pop.classList.add('open');
}

function hideMentionPop() {
  var pop = document.getElementById('mention-pop');
  if (pop) pop.classList.remove('open');
  _mentionQ   = null;
  _mentionIdx = -1;
}

function selectMention(name) {
  var ta     = document.getElementById('chat-ta');
  var pos    = ta.selectionStart;
  var before = ta.value.substring(0, pos);
  var after  = ta.value.substring(pos);
  var newBefore = before.replace(/@\w*$/, '@' + name + ' ');
  ta.value = newBefore + after;
  ta.selectionStart = ta.selectionEnd = newBefore.length;
  hideMentionPop();
  ta.focus();
}

// ── Persona chat ─────────────────────────────────────────────────────────────

function openPersonaChat(name) {
  send({action:'openChat', name:name});
}

// Called from C++ when a chat session opens or switches persona.
function startChat(name) {
  _chatPersona    = name;
  _activePersonas = [name];
  var right = document.getElementById('right');
  right.classList.add('open');
  document.getElementById('resizer').classList.add('visible');

  document.getElementById('chat-name-label').textContent = name;

  var av = document.getElementById('chat-avatar-sm');
  var url = _imgs[norm(name)];
  if (url) {
    av.innerHTML = '<img src="' + esc(url) + '" alt="">';
    av.style.background = '';
  } else {
    av.innerHTML = esc(name.trim().charAt(0).toUpperCase());
    av.style.background = nameColor(name);
  }

  renderGrid();    // re-render grid to highlight active card
  renderGroups();  // re-render groups to highlight active group
  var ta = document.getElementById('chat-ta');
  if (ta) { ta.disabled = false; ta.focus(); }
}

// Called from C++ to refresh the chat history and busy state.
function updateChatHistory(html, busy) {
  var hist = document.getElementById('chat-history');
  hist.innerHTML = html;
  // Syntax-highlight any code blocks in the new content.
  if (typeof hljs !== 'undefined') {
    hist.querySelectorAll('pre code').forEach(function(el) {
      hljs.highlightElement(el);
    });
  }
  // Render any mermaid diagrams.
  if (typeof mermaid !== 'undefined') {
    var mermaidNodes = Array.from(hist.querySelectorAll('.mermaid'));
    if (mermaidNodes.length > 0) mermaid.run({nodes: mermaidNodes});
  }
  // Detect CJK content and boost font size for readability.
  hist.classList.toggle('lang-cjk', /[\u4e00-\u9fff\u3400-\u4dbf\u3000-\u303f]/.test(hist.textContent));
  hist.scrollTop = hist.scrollHeight;
  var ta  = document.getElementById('chat-ta');
  var btn = document.getElementById('send-btn');
  if (ta)  ta.disabled  = busy;
  if (btn) btn.disabled = busy;
  if (!busy && ta) ta.focus();
}

// Called from C++ when the chat is closed (from C++ side).
function closeChat() {
  _chatPersona    = null;
  _activePersonas = [];
  document.getElementById('right').classList.remove('open');
  document.getElementById('resizer').classList.remove('visible');
  document.getElementById('chat-history').innerHTML = '';
  document.getElementById('invite-picker').classList.remove('open');
  hideMentionPop();
  renderGrid();
  send({action:'closeChat'});
}

function clearChat() {
  send({action:'clearChat'});
}

function doSend() {
  var ta = document.getElementById('chat-ta');
  var text = ta ? ta.value.trim() : '';
  if (!text || !_chatPersona) return;
  hideMentionPop();
  var useArticle = document.getElementById('article-toggle').checked;
  var directTo   = null;
  var dm = text.match(/^@(\S+)\s/);
  if (dm && _activePersonas.indexOf(dm[1]) !== -1) directTo = dm[1];
  send({action:'sendMessage', text:text, useArticle:useArticle, directTo:directTo});
  ta.value = '';
}

function chatKey(e) {
  var pop = document.getElementById('mention-pop');
  if (pop && pop.classList.contains('open')) {
    var items = pop.querySelectorAll('.mention-item');
    if (e.key === 'Escape') { hideMentionPop(); e.preventDefault(); return; }
    if (e.key === 'ArrowDown') {
      _mentionIdx = Math.min(_mentionIdx + 1, items.length - 1);
      renderMentionPop(); e.preventDefault(); return;
    }
    if (e.key === 'ArrowUp') {
      _mentionIdx = Math.max(_mentionIdx - 1, 0);
      renderMentionPop(); e.preventDefault(); return;
    }
    if (e.key === 'Enter' && _mentionIdx >= 0 && items[_mentionIdx]) {
      items[_mentionIdx].click(); e.preventDefault(); return;
    }
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    doSend();
  }
}

// ── Font size floater ────────────────────────────────────────────────────────

var _chatFontSize = 12;

function setChatFontSize(n) {
  _chatFontSize = Math.max(8, Math.min(24, n));
  document.documentElement.style.setProperty('--chat-msg-size', _chatFontSize + 'px');
  var lbl = document.getElementById('font-size-label');
  if (lbl) lbl.textContent = _chatFontSize + 'px';
  try { localStorage.setItem('chatFontSize', _chatFontSize); } catch(e) {}
}

// ── Resizable chat panel ─────────────────────────────────────────────────────
(function() {
  var resizer = document.getElementById('resizer');
  var right   = document.getElementById('right');
  var startX, startW;

  resizer.addEventListener('mousedown', function(e) {
    startX = e.clientX;
    startW = right.offsetWidth;
    resizer.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    e.preventDefault();
  });

  function onMove(e) {
    // Moving left (negative delta) widens the right panel.
    var delta = startX - e.clientX;
    var newW  = Math.max(220, Math.min(window.innerWidth - 200, startW + delta));
    right.style.width = newW + 'px';
  }

  function onUp() {
    resizer.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
  }
})();

// ── Mermaid right-click repair ───────────────────────────────────────────────

var _ctxSrc = null;

function repairMermaid(source) {
  send({action:'repairMermaid', source:source});
  var menu = document.getElementById('ctx-menu');
  menu.classList.remove('open');
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('open');
  _ctxSrc = null;
}

document.addEventListener('contextmenu', function(e) {
  // Walk up manually — closest() is unreliable inside SVG (mermaid error renders).
  var node = e.target, wrapper = null;
  while (node && node !== document.body) {
    if (node.classList && node.classList.contains('mermaid-wrapper')) {
      wrapper = node; break;
    }
    node = node.parentNode;
  }
  if (!wrapper) return;
  e.preventDefault();
  _ctxSrc = wrapper.getAttribute('data-src') || '';
  var menu = document.getElementById('ctx-menu');
  menu.innerHTML =
    '<div class="ctx-item" onclick="repairMermaid(\'' + ej(_ctxSrc) + '\')">⟳ Fix diagram</div>';
  menu.style.left = e.clientX + 'px';
  menu.style.top  = e.clientY + 'px';
  menu.classList.add('open');
});

document.addEventListener('click', function(e) {
  var menu = document.getElementById('ctx-menu');
  if (menu && !menu.contains(e.target)) hideCtxMenu();
});

document.addEventListener('DOMContentLoaded', function() {
  try {
    var saved = localStorage.getItem('chatFontSize');
    if (saved) setChatFontSize(parseInt(saved, 10));
  } catch(e) {}
  send({action:'ready'});
  document.getElementById('search').focus();
});
</script>
